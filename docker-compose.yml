services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eccomi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eccomi"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published ports: only the app container reaches the database.

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/eccomi
      APP_PASSWORD: ${APP_PASSWORD:?imposta APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?imposta SESSION_SECRET in .env}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
